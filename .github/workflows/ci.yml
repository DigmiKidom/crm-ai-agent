name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A second push to the same PR should cancel the still-running check for the
# previous one, rather than queuing both to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build-time only, dummy values — nothing here talks to a real
          # database or a real provider. connectDB()/getClient() are lazy
          # (see lib/db.js, lib/email.js), so these just need to be *present*
          # so any module-scope env var read doesn't crash the build; no
          # network call happens until a request actually needs one.
          MONGODB_URI: mongodb://localhost:27017/ci-build-placeholder
          AUTH_SECRET: ci-build-placeholder-secret
          GOOGLE_API_KEY: ci-build-placeholder
          RESEND_API_KEY: ci-build-placeholder
          APP_URL: http://localhost:3000
